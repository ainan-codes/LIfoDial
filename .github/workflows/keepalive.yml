name: Keep Render Services Awake

# Pings the Render free-tier services to keep them from sleeping. Render sleeps a
# free service after ~15 min without inbound HTTP — and for the voice worker the
# LiveKit WebSocket does NOT count as activity, only HTTP does.
#
# ⚠️ DO NOT TRUST THIS TO KEEP THE WORKER AWAKE. The schedule below asks for every
# 5 minutes. GitHub does not honour it. Actual run times pulled from the API on
# 2026-07-29:
#
#     00:09  03:33  06:15  09:10  11:32  13:16
#
# Gaps of one to three HOURS against a 15-minute sleep window. Scheduled workflows
# are best-effort and heavily deprioritised on shared runners, and there is no
# setting that changes this. The old comment here claimed "delayed several minutes
# under load", which is what made this look like working protection; it is not.
#
# Consequence, seen in production: the worker is asleep essentially whenever
# someone goes to use it, so the ~55s cold start lands on whoever pressed the
# button. That surfaced as
#     "Agent worker did NOT come up within 90s … NOT creating a room"
#
# What ACTUALLY covers this, in order of reliability:
#   1. Move lifodial-agent to a paid Render plan — it then never sleeps. This is
#      the only real fix and it is ~$7/mo.
#   2. An external uptime pinger (UptimeRobot / cron-job.org, both free) hitting
#      https://lifodial-agent.onrender.com/worker every 5 min. These actually run
#      on the interval they promise, unlike GitHub cron.
#   3. The in-app warm-on-open path: opening the Test Agent panel calls
#      POST /agents/voice-worker/warm, which starts the boot while the admin reads
#      the screen (backend/services/agent_worker.py::start_background_warm).
#      This does not prevent the sleep, it just moves the wait off the button.
#
# Keep this workflow — a ping every couple of hours is still better than none, and
# the manual trigger below is genuinely useful before a demo.
#
# Worker note: GET / on lifodial-agent returns 200 "OK" only when the worker
# process is healthy AND its LiveKit connection is up (503 otherwise), so this
# ping doubles as a registration check, not just a liveness ping.

on:
  schedule:
    # Requested every 5 minutes. GitHub delivers roughly every 1-3 hours — see
    # the measurements above. Left at */5 because asking for more often costs
    # nothing and occasionally gets us a closer run.
    - cron: '*/5 * * * *'
  workflow_dispatch:  # run manually from the Actions tab — do this before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging https://lifodial.onrender.com/health"
          for i in 1 2 3; do
            if curl -fsSL --max-time 30 https://lifodial.onrender.com/health; then
              echo ""
              echo "Backend ping OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All 3 attempts failed."
          exit 1

      - name: Ping voice worker / (health + LiveKit registration)
        # --max-time 120: a cold start takes ~60-120s on the free instance.
        run: |
          echo "Pinging https://lifodial-agent.onrender.com/"
          for i in 1 2 3; do
            if curl -fsSL --max-time 120 https://lifodial-agent.onrender.com/; then
              echo ""
              echo "Worker ping OK on attempt $i (200 = alive AND registered with LiveKit)"
              exit 0
            fi
            echo "Attempt $i failed (worker down, cold-starting, or not registered), retrying in 15s..."
            sleep 15
          done
          echo "All 3 attempts failed — worker is down or cannot register with LiveKit."
          exit 1
